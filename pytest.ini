[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --cov=src
    --cov-report=html
    --cov-report=term-missing
    --strict-markers
    -v
markers =
    slow: marks tests as slow
    integration: marks tests as integration
    unit: marks tests as unit
